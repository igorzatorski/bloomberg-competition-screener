[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloomberg-competition-screener"
version = "0.1.0"
description = "Weekly momentum screener for a simulated trading competition"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "yfinance>=0.2.54,<1", "requests>=2.31,<3", "pyarrow>=18,<24", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
run-screener = "competition_screener.cli:main"
download-data = "competition_screener.download:main"
run-backtest = "competition_screener.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
